name: "Test Build"

on: [pull_request]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository and submodules
      uses: actions/checkout@v2
      with:
         submodules: recursive        
        
    - name: List directory contents
      run: pwd; ls -la      
      
    - name: start xvfb
      run:
        Xvfb :0 &

    - name: initialize the X11 DISPLAY variable
      run:
        export DISPLAY=:0

    - name: After checkout, list directory contnts
      run: pwd; ls -la        
    - name: Install libraries
      run: |
          sudo apt update
          sudo apt install libgtk2.0-0
          
    - name: Install JavaFX JDK from jvm.json
      run: |
        JDK_ARCHIVE=$(bash jvm/getJdkArchiveFile.sh)
        JDK_HOME=$(pwd)/$(bash jvm/getJdkArchiveName.sh)
        wget $(bash jvm/getJdkUrl.sh)
        case $JDK_ARCHIVE in
          *.zip) unzip -q $JDK_ARCHIVE ;;
          *) tar -xzf $JDK_ARCHIVE ;;
        esac
        if test -d $JDK_HOME/Contents/Home; then JDK_HOME=$JDK_HOME/Contents/Home; fi
        echo "JAVA_HOME=$JDK_HOME" >> $GITHUB_ENV
        echo "PATH=$JDK_HOME/bin:$PATH" >> $GITHUB_ENV

      
    - name: Test with Gradle 
      run: xvfb-run -s '-screen 0 1024x768x24' ./gradlew test     
  
      

  # Catch dependency changes that would make the lockfile inconsistent.
  # Regenerate after a dependency change and commit the result:
  #   ./gradlew --write-locks lockClasspaths
  lockfile-drift:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 25
      uses: actions/setup-java@v4
      with:
        distribution: zulu
        java-version: '25'

    - name: Regenerate lockfile
      run: ./gradlew --no-daemon --write-locks lockClasspaths

    - name: Fail if lockfile changed
      run: |
        if ! git diff --exit-code -- gradle.lockfile; then
          echo "::error::gradle.lockfile is out of date. Regenerate it and commit the result:"
          echo "  ./gradlew --write-locks lockClasspaths"
          exit 1
        fi
